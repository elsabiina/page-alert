# Auth Service Main Configuration
# Default profile is 'dev' for local development with H2 database
spring:
  application:
    name: auth-service
  profiles:
    default: dev  # Default to development profile

server:
  port: 4005

# Common JWT configuration - profile-specific overrides in profile files
jwt: 
  secret: ${JWT_SECRET:myDefaultSecretKeyThatShouldBeChangedInProduction123456789}
  cookie:
    name: ${JWT_COOKIE_NAME:authToken}
    secure: ${JWT_COOKIE_SECURE:false}
    http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    same-site: ${JWT_COOKIE_SAME_SITE:Strict}
    max-age: ${JWT_COOKIE_MAX_AGE:3600}
    domain: ${JWT_COOKIE_DOMAIN:}

# Common logging configuration
logging:
  level:
    root: info
