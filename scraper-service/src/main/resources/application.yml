# Scraper Service Main Configuration
# Default profile is 'dev' for local development with H2 database
spring:
  application:
    name: scraper-service
  profiles:
    default: dev  # Default to development profile

server:
  port: 4015
  
# Common scraper configuration
scraper:
  url: ${SCRAPER_URL:http://localhost:5000/api/v1}
  api:
    key: ${SCRAPER_API_KEY:default-api-key}

# Common logging configuration
logging:
  level:
    root: info
