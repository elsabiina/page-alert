# Docker profile configuration
# For running with docker-compose using container networking
spring:
  profiles:
    active: docker
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        # auth-service routes (container networking)
        - id: auth-service-route
          uri: http://auth-service:4005
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        
        # user-service routes (container networking)
        - id: public-create-user-account
          uri: http://user-service:4000
          predicates:
            - Path=/api/users/create-user-account
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
        - id: user-service-route
          uri: http://user-service:4000
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - CookieJwtValidation
        
        # scraper-service routes (container networking)
        - id: scraper-service-route
          uri: http://scraper-service:4015
          predicates:
            - Path=/api/urls/**
          filters:
            - StripPrefix=1
            - CookieJwtValidation
        - id: scraper-route
          uri: http://scraper:5000
          predicates:
            - Path=/scraper/**
          filters:
            - StripPrefix=1

server:
  port: 4010

# JWT Configuration for Docker
jwt:
  secret: ${JWT_SECRET:myDefaultSecretKeyThatShouldBeChangedInProduction123456789}
  cookie:
    name: ${JWT_COOKIE_NAME:authToken}
    secure: ${JWT_COOKIE_SECURE:false}  # Set to true in production with HTTPS
    http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    same-site: ${JWT_COOKIE_SAME_SITE:Strict}
    max-age: ${JWT_COOKIE_MAX_AGE:86400}  # 24 hours in seconds

# CORS Configuration for Docker
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:4200}
  allowed-credentials: ${CORS_ALLOWED_CREDENTIALS:true}

logging:
  level: 
    root: info
    es.oscasais.pa.apiguard: debug
    org.springframework.cloud.gateway: debug