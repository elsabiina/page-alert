# Development profile configuration
# Uses H2 in-memory database for local development
spring:
  profiles:
    active: dev
  
  # H2 Database configuration for development
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    enabled: false
  datasource:
    url: jdbc:h2:mem:userdb
    driver-class-name: org.h2.Driver
    username: developer
    password: password
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  
  # Kafka configuration for development (localhost)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service 
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "userevent:es.oscasais.pa.userService.dto.kafka.UserEventDTO, userconfirmationevent:es.oscasais.pa.userService.dto.kafka.EmailConfirmationEventDTO"

server:
  port: 4000

logging:
  level:
    root: ${LOGGING_LEVEL:INFO}
    es.oscasais.pa.userService: debug