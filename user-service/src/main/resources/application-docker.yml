# Docker profile configuration
# Uses PostgreSQL database in Docker containers
spring:
  profiles:
    active: docker
  
  # PostgreSQL Database configuration for Docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://user-service-db:5432/db}
    username: ${SPRING_DATASOURCE_USERNAME:developer}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
  sql:
    init:
      mode: always
  
  # Kafka configuration for Docker (container networking)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: user-service 
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "userevent:es.oscasais.pa.userService.dto.kafka.UserEventDTO, userconfirmationevent:es.oscasais.pa.userService.dto.kafka.EmailConfirmationEventDTO"
  
  # Disable H2 console in Docker
  h2:
    console:
      enabled: false
  security:
    enabled: false

server:
  port: 4000

logging:
  level:
    root: ${LOGGING_LEVEL:INFO}
    es.oscasais.pa.userService: info